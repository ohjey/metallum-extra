org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric / Minecraft (match Metallum's own build)
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16-SNAPSHOT

# The Metallum release on Modrinth this build hooks into.
# Metallum Extra patches Metallum internals, so it is pinned to ONE exact version.
# To port to a new Metallum release: bump this, rebuild, and fix any mixin that fails.
metallum_version=0.0.23
modmenu_version=20.0.3
sodium_version=mc26.2-0.9.2-fabric
fabric_api_version=0.161.0+26.2

# Mod
mod_version=0.1.0
maven_group=com.metallumextra
