org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric / Minecraft (match Metallum's own build)
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.16-SNAPSHOT

# The Metallum releases on Modrinth this build hooks into: metallum_version up to metallum_max_version.
# Metallum Extra patches Metallum internals, so it only accepts releases it has been checked against.
# It is compiled against metallum_version, the OLDEST one, so the code cannot come to rely on something only a
# newer release has.
# To add a new Metallum release: raise metallum_max_version, launch with -Pmetallum_run_version=<it>, and fix any
# mixin that fails (see "Updating" in the README).
metallum_version=0.0.23
metallum_max_version=0.0.24
modmenu_version=20.0.3
sodium_version=mc26.2-0.9.2-fabric
fabric_api_version=0.161.0+26.2
distant_horizons_version=3.3.3-26.2

# Mod
mod_version=0.1.0
maven_group=com.metallumextra
